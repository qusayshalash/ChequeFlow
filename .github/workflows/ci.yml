name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.20.0'
  PNPM_VERSION: '10.15.0'
  # Placeholder values: CI never touches real secrets, and the environment
  # schema refuses to boot without them.
  JWT_ACCESS_SECRET: ci-access-secret-that-is-long-enough-000001
  JWT_REFRESH_SECRET: ci-refresh-secret-that-is-long-enough-00002
  FIELD_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  S3_ENDPOINT: http://127.0.0.1:9000
  S3_BUCKET: cheque-images-ci
  S3_ACCESS_KEY_ID: ci-access-key
  S3_SECRET_ACCESS_KEY: ci-secret-key
  # CI has no cloud OCR account and must never call one.
  OCR_PROVIDER: mock

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: chequeflow
          POSTGRES_PASSWORD: chequeflow_ci
          POSTGRES_DB: chequeflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U chequeflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://chequeflow:chequeflow_ci@localhost:5432/chequeflow_test
      TEST_DATABASE_URL: postgresql://chequeflow:chequeflow_ci@localhost:5432/chequeflow_test

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:deploy

      - name: Build workspace packages
        run: pnpm --filter "./packages/*" build

      # Object storage for the image-upload tests; without it the upload test
      # fails and takes the rest of the cheque lifecycle suite down with it.
      #
      # This was MinIO, pinned to a release, and it broke with no change on
      # this side: the images were withdrawn from Docker Hub and the copies on
      # quay.io now require an account. CI went red on every push for weeks
      # before anyone looked. RustFS speaks the same S3 API and is published,
      # and unlike a mock it validates request signatures — so the API's own
      # signing, presigned image URLs included, is actually exercised here.
      #
      # Started with `docker run` rather than as a `services:` container so
      # that a failure to start is a step that fails, with its logs, rather
      # than a job that never begins.
      - name: Start object storage
        run: |
          docker run -d --name storage -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY="$S3_ACCESS_KEY_ID" \
            -e RUSTFS_SECRET_KEY="$S3_SECRET_ACCESS_KEY" \
            -e RUSTFS_ADDRESS=0.0.0.0:9000 \
            -e RUSTFS_VOLUMES=/data \
            rustfs/rustfs:1.0.4

          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/health >/dev/null; then
              echo "Object storage ready after ${attempt} attempt(s)"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Object storage did not become ready" >&2
              docker logs storage >&2
              exit 1
            fi
            sleep 2
          done

          # Created here rather than left to the API's startup, so a storage
          # problem fails this step by name instead of surfacing as a test
          # failure. New buckets are private under the S3 API, which is what
          # the old `mc anonymous set none` was asserting.
          AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$S3_SECRET_ACCESS_KEY" \
            aws --endpoint-url http://127.0.0.1:9000 --region us-east-1 \
            s3api create-bucket --bucket "$S3_BUCKET"

      - name: Run end-to-end tests
        run: pnpm --filter @cheque-flow/api test:e2e

      - name: Object storage logs
        if: failure()
        run: docker logs storage

  mobile-bundle:
    name: mobile bundle (Metro)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter "./packages/*" build

      # Proves the Expo app bundles for both platforms without needing Xcode
      # or Android Studio in CI.
      - name: Export Android bundle
        run: pnpm --filter @cheque-flow/mobile exec expo export --platform android --output-dir dist-ci

      - name: Export iOS bundle
        run: pnpm --filter @cheque-flow/mobile exec expo export --platform ios --output-dir dist-ci-ios

  # The production stack, exactly as docs/deployment.md tells an operator to
  # run it: both images built, every service started from the production
  # compose file, the first owner created with the bootstrap, and then the
  # paths a real user takes — over HTTPS, through the proxy. The step that
  # matters most is the last one: a cheque image opened through its signed
  # link on the public files address, which only works if storage, the proxy,
  # the signing address and the bucket are all right at once.
  production-stack:
    name: production stack (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5

      - name: Write a throwaway production environment
        run: |
          {
            echo "APP_DOMAIN=localhost"
            echo "FILES_DOMAIN=files.localhost"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "JWT_ACCESS_SECRET=$(openssl rand -hex 32)"
            echo "JWT_REFRESH_SECRET=$(openssl rand -hex 32)"
            echo "FIELD_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "S3_ACCESS_KEY_ID=chequeflow"
            echo "S3_SECRET_ACCESS_KEY=$(openssl rand -hex 24)"
            # A real provider is required in production; the key is never used,
            # because no cheque is sent for reading here.
            echo "OCR_PROVIDER=claude"
            echo "ANTHROPIC_API_KEY=ci-placeholder-never-called"
            echo "PUSH_ENABLED=false"
          } > infrastructure/.env.production

      # The workflow's own variables (OCR_PROVIDER=mock among them) would
      # override the env file: docker compose gives the shell's environment
      # precedence over --env-file. So every call runs with an empty
      # environment, as it would on a fresh server — which is also how this
      # job first caught that collision.
      - name: Write the compose helper
        run: |
          cat > dc <<'SH'
          #!/bin/sh
          exec env -i PATH="$PATH" HOME="$HOME" docker compose \
            --env-file infrastructure/.env.production \
            -f infrastructure/docker-compose.prod.yml "$@"
          SH
          chmod +x dc

      - name: Build and start the stack
        run: >
          ./dc up -d --build

      - name: Wait for HTTPS
        run: |
          for attempt in $(seq 1 90); do
            if curl -skf https://localhost/api/v1/health >/dev/null; then
              echo "API answering through the proxy after ${attempt} attempt(s)"; exit 0
            fi
            sleep 3
          done
          ./dc ps
          ./dc logs --tail 80
          exit 1

      - name: Create the first owner
        run: >
          ./dc run --rm
          -e ORG_NAME=CI -e ORG_TIMEZONE=Asia/Hebron
          -e OWNER_NAME=Owner -e OWNER_EMAIL=owner@ci.test -e OWNER_PASSWORD=Ci-Owner-Pass-2026
          migrate /repo/node_modules/.bin/tsx /repo/packages/database/prisma/bootstrap.ts

      - name: Use it the way a person would
        run: |
          set -e
          TOKEN=$(curl -skf https://localhost/api/v1/auth/login \
            -H 'content-type: application/json' \
            -d '{"email":"owner@ci.test","password":"Ci-Owner-Pass-2026"}' | jq -r .accessToken)
          test -n "$TOKEN" && test "$TOKEN" != null
          AUTH="authorization: Bearer $TOKEN"

          # The organization's zone travels with the session.
          test "$(curl -skf https://localhost/api/v1/auth/me -H "$AUTH" | jq -r .timeZone)" = "Asia/Hebron"

          # The dashboard is served.
          curl -skf https://localhost/login -o /dev/null

          # A cheque, a photograph of it, and the photograph opened again
          # through its signed link on the public files address.
          CHEQUE=$(curl -skf https://localhost/api/v1/cheques -H "$AUTH" \
            -H 'content-type: application/json' \
            -d '{"direction":"INCOMING","chequeNumber":"CI-0001","amount":"100.00","currency":"ILS","dueDate":"2027-01-15"}' \
            | jq -r .cheque.id)
          echo '/9j/4AAQSkZJRgABAQEAYABgAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDL/wAALCAABAAEBAREA/8QAFAABAAAAAAAAAAAAAAAAAAAACf/EABQQAQAAAAAAAAAAAAAAAAAAAAD/2gAIAQEAAD8AKp//2Q==' \
            | base64 -d > front.jpg
          IMAGE=$(curl -skf "https://localhost/api/v1/cheques/$CHEQUE/images" -H "$AUTH" \
            -F side=FRONT -F "file=@front.jpg;type=image/jpeg" | jq -r .image.id)
          URL=$(curl -skf "https://localhost/api/v1/cheques/$CHEQUE/images/$IMAGE/url" -H "$AUTH" | jq -r .url)
          echo "signed link host: $(echo "$URL" | cut -d/ -f3)"
          case "$URL" in https://files.localhost/*) ;; *) echo "signed for the wrong address: $URL" >&2; exit 1 ;; esac
          curl -skf "$URL" -o fetched.jpg
          cmp front.jpg fetched.jpg
          echo "image round-trip through the public address: identical"

      - name: Stack logs
        if: failure()
        run: >
          ./dc logs --tail 150
