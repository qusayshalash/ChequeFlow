name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.20.0'
  PNPM_VERSION: '10.15.0'
  # Placeholder values: CI never touches real secrets, and the environment
  # schema refuses to boot without them.
  JWT_ACCESS_SECRET: ci-access-secret-that-is-long-enough-000001
  JWT_REFRESH_SECRET: ci-refresh-secret-that-is-long-enough-00002
  FIELD_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  S3_ENDPOINT: http://127.0.0.1:9000
  S3_BUCKET: cheque-images-ci
  S3_ACCESS_KEY_ID: ci-access-key
  S3_SECRET_ACCESS_KEY: ci-secret-key
  # CI has no cloud OCR account and must never call one.
  OCR_PROVIDER: mock

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: chequeflow
          POSTGRES_PASSWORD: chequeflow_ci
          POSTGRES_DB: chequeflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U chequeflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://chequeflow:chequeflow_ci@localhost:5432/chequeflow_test
      TEST_DATABASE_URL: postgresql://chequeflow:chequeflow_ci@localhost:5432/chequeflow_test

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:deploy

      - name: Build workspace packages
        run: pnpm --filter "./packages/*" build

      # MinIO cannot be a `services:` container: it needs the `server /data`
      # command, which service containers cannot express. Without object
      # storage the image-upload test fails and takes the rest of the cheque
      # lifecycle suite down with it.
      - name: Start object storage
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$S3_ACCESS_KEY_ID" \
            -e MINIO_ROOT_PASSWORD="$S3_SECRET_ACCESS_KEY" \
            minio/minio:RELEASE.2025-07-23T15-54-02Z server /data

          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null; then
              echo "MinIO ready after ${attempt} attempt(s)"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "MinIO did not become ready" >&2
              docker logs minio >&2
              exit 1
            fi
            sleep 2
          done

          # The mc image's entrypoint is `mc` itself, so a shell has to be
          # requested explicitly to run more than one command.
          docker run --rm --network host --entrypoint /bin/sh \
            minio/mc:RELEASE.2025-07-21T05-28-08Z -c "
              mc alias set ci http://127.0.0.1:9000 '$S3_ACCESS_KEY_ID' '$S3_SECRET_ACCESS_KEY' &&
              mc mb --ignore-existing ci/$S3_BUCKET &&
              mc anonymous set none ci/$S3_BUCKET"

      - name: Run end-to-end tests
        run: pnpm --filter @cheque-flow/api test:e2e

      - name: Object storage logs
        if: failure()
        run: docker logs minio

  mobile-bundle:
    name: mobile bundle (Metro)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm --filter "./packages/*" build

      # Proves the Expo app bundles for both platforms without needing Xcode
      # or Android Studio in CI.
      - name: Export Android bundle
        run: pnpm --filter @cheque-flow/mobile exec expo export --platform android --output-dir dist-ci

      - name: Export iOS bundle
        run: pnpm --filter @cheque-flow/mobile exec expo export --platform ios --output-dir dist-ci-ios
