name: cheque-flow

services:
  postgres:
    image: postgres:17.6-alpine
    container_name: chequeflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chequeflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chequeflow_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-chequeflow}
      TZ: UTC
      PGTZ: UTC
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-chequeflow} -d ${POSTGRES_DB:-chequeflow}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.2-alpine
    container_name: chequeflow-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible storage for cheque images. This was MinIO, pinned to a
  # release that was withdrawn from Docker Hub — the copies on quay.io now
  # need an account — so `pnpm infra:up` failed at this service with no change
  # on this side. RustFS speaks the same API. The bucket is created by the API
  # itself on first start in development, so no separate init job is needed.
  storage:
    image: rustfs/rustfs:1.0.4
    container_name: chequeflow-storage
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-chequeflow}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-chequeflow_dev_password}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_VOLUMES: /data
    ports:
      - '${STORAGE_PORT:-9000}:9000'
    volumes:
      - storage-data:/data

volumes:
  postgres-data:
  redis-data:
  storage-data:
